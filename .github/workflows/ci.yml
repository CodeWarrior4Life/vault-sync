name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        # TKT-ebc0237d: the Linux leg is pinned to ubuntu-24.04 (ubuntu-latest is migrating to 26.04).
        os: [windows-latest, macos-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy,rustfmt' }
      # TKT-ebc0237d: every `matrix.os == '...'` guard must name a matrix entry. A guard that matches nothing skips
      # its step SILENTLY (the CS-2 negcontrol, the supervisor tests). Guarded by runner.os, not by a matrix string,
      # so this check runs on the Linux leg even if every matrix guard were wrong.
      - name: Matrix guard sanity (TKT-ebc0237d)
        if: runner.os == 'Linux'
        run: |
          set -eu
          f=.github/workflows/ci.yml
          matrix=$(sed -n 's/^ *os: \[\(.*\)\]$/\1/p' "$f" | tr -d ' ')
          echo "matrix: $matrix"
          bad=0
          guards=$(grep -E "^[[:space:]]*if: matrix\.os == '" "$f" | sed "s/.*== '\([^']*\)'.*/\1/")
          [ -n "$guards" ] || { echo "::error::no matrix.os guards found (parser broken?)"; exit 1; }
          for g in $(printf '%s\n' "$guards" | sort -u); do
            n=$(printf '%s\n' "$guards" | grep -cx -- "$g")
            case ",$matrix," in
              *",$g,"*) echo "guard matrix.os == '$g' ($n steps): matches a matrix entry" ;;
              *) echo "::error::guard matrix.os == '$g' ($n steps) matches NO matrix entry: those steps never run"; bad=1 ;;
            esac
          done
          [ "${{ matrix.os }}" = ubuntu-24.04 ] || { echo "::error::the Linux leg is ${{ matrix.os }}, not ubuntu-24.04"; bad=1; }
          exit $bad
      # TKT-ebc0237d: the apt step hung to the 25-min job timeout 4x (no DEBIAN_FRONTEND, no step bound). Now:
      # non-interactive, an 8-min step bound, each apt call bounded at 300 s, and one in-step retry.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2; do
            sudo -E timeout 300 apt-get update && sudo -E timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev gnome-keyring && exit 0
            echo "apt attempt $i failed/hung; retrying"; sleep 15
          done
          exit 1
      - name: Start gnome-keyring (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          eval $(dbus-launch --sh-syntax)
          mkdir -p ~/.cache ~/.local/share/keyrings
          (echo -n "" | gnome-keyring-daemon --unlock --components=secrets)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # CS-2 (TKT-23091e72) gate self-test: every planted mutation in
      # tests/fixtures/state_io_neg must make its gate fail.
      - name: state_io gate negative controls (CS-2 §3.5)
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/state_io_gate_negcontrol.sh
      # O5-2a: the host supervisor's inactive-unit alert + the unchanged not_receiving path (PATH shims, ~8 s).
      - name: nexus-vault-sync-supervisor tests (O5-2a)
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/supervisor/test-supervisor.sh
      - run: cargo test --all-targets
        working-directory: src-tauri
      # CS-1 §4b / T-CS1-17: record which directory-durability branch fired
      # (F_FULLFSYNC success or the fsync fallback) on the macOS legs.
      # CS-2 §3.3a step 3: record what openat(held, "..") does once the held
      # dir is unlinked, per OS (the test asserts the valve stays latched).
      - name: Record unlinked-held-dir probe (T-CS2-31)
        if: runner.os != 'Windows'
        run: cargo test --lib t_cs2_31_unlinked_held_dir_parent_probe -- --nocapture
        working-directory: src-tauri
      - name: Record macOS directory-sync branch (T-CS1-17)
        if: runner.os == 'macOS'
        run: cargo test --lib t_cs1_17_real_filesystem_branch_is_recorded -- --nocapture
        working-directory: src-tauri
