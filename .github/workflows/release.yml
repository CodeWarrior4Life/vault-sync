name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed by softprops/action-gh-release to create + upload assets
  id-token: write     # B2 (PB-2D87-VS-SCOPE): OIDC token for actions/attest-build-provenance
  attestations: write # B2: write the SLSA provenance attestation for each shipped artifact

jobs:
  build:
    strategy:
      fail-fast: false  # one platform's transient upload failure must NOT cancel the others (S481)
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,    platform: darwin-x86_64 }
          - { os: macos-15,       target: aarch64-apple-darwin,   platform: darwin-aarch64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable @ 2026-10-29; pinned by SHA (PR #43 review M2: id-token is job-wide)
        with: { targets: '${{ matrix.target }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5  # guarantees `python3` for the upload/verify scripts under bash on windows (S486)
        with: { python-version: '3.12' }
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev
      - run: npm ci
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}
      # TKT-940d5263: the macOS updater bundle is "<product>.app.tar.gz" (+ .sig) on BOTH darwin targets, so
      # it was missing from the GH release (no glob) and its .sig collided across the two darwin jobs. Stage
      # arch-named copies OUTSIDE the bundle dir: upload-to-nexus.sh discovers its artifact with
      # `find ... -name '*.sig' | head -1` inside bundle/, so nothing may be added there.
      - name: Stage arch-named macOS updater bundles for the GH release
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        env:
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/macos
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist-gh
          n=0
          for f in "$BUNDLE_DIR"/*.app.tar.gz "$BUNDLE_DIR"/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            cp "$f" "dist-gh/${b/.app.tar.gz/_${PLATFORM}.app.tar.gz}"
            n=$((n+1))
          done
          [ "$n" -eq 2 ] || { echo "::error::expected 1 .app.tar.gz + 1 .sig in $BUNDLE_DIR, staged $n"; exit 1; }
          ls -l dist-gh
      # B2 (PB-2D87-VS-SCOPE, vault-sync 0.5.1 fleet placement plan): SLSA build provenance for EVERY file
      # the GH release ships, so a downloaded asset proves which workflow run and which commit built it:
      #   gh attestation verify <file> --repo CodeWarrior4Life/vault-sync \
      #     --signer-workflow CodeWarrior4Life/vault-sync/.github/workflows/release.yml \
      #     --source-ref refs/tags/vX.Y.Z --deny-self-hosted-runners
      # (--signer-workflow + --source-ref are REQUIRED: without them any workflow in the repo with
      #  id-token could produce a passing attestation; PR #43 review M1.) This step is fail-closed: if
      # Sigstore/attestations are down the leg uploads nothing (review M3).
      # The subject list mirrors the "Upload to GH Release" files list below; keep the two in step.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            dist-gh/*
      - name: Upload to GH Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 @ 2026-10-29; pinned by SHA (PR #43 review M2)
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            dist-gh/*
      - name: Upload to Nexus (stage)
        continue-on-error: true
        shell: bash  # windows-latest defaults to pwsh, which can't run the .sh uploader → nothing staged (S486)
        env:
          NEXUS_CI_TOKEN: ${{ secrets.NEXUS_CI_TOKEN }}
        run: ./scripts/upload-to-nexus.sh ${{ matrix.platform }} ${{ github.ref_name }}
      - name: Cache rsign2 (minisign verifier)
        # Restores the from-source rsign build across releases so the HARD GATE
        # below doesn't rebuild it (or hit a crates.io hiccup) on every run.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/rsign
            ~/.cargo/bin/rsign.exe
          key: rsign2-${{ runner.os }}-v1
      - name: Verify Nexus publish (HARD GATE)
        shell: bash  # windows-latest defaults to pwsh, which can't run the .sh verifier (S486)
        env:
          NEXUS_CI_TOKEN: ${{ secrets.NEXUS_CI_TOKEN }}
        run: ./scripts/verify-nexus-release.sh ${{ matrix.platform }} ${{ github.ref_name }}
      - name: Promote on Nexus (go live → auto-update)
        # Placement gate (2026-10-26): promotion makes this release the updater's
        # /latest, i.e. every auto-updating vault daemon on every host moves to it.
        # That is fleet-wide placement, which needs its own decision, so it is
        # OPT-IN: set the repo variable VAULT_SYNC_AUTOPROMOTE=true to promote from
        # the tag run. Default (unset): the release is built, staged and verified
        # only; promote later per platform with scripts/promote-nexus.sh.
        if: ${{ vars.VAULT_SYNC_AUTOPROMOTE == 'true' }}
        # v0.4.13 (S493): flip the just-verified release to is_current=TRUE so
        # the updater /latest endpoint actually serves it. WITHOUT this the
        # upload stays STAGED (S484 gate) and NO daemon auto-updates — the fleet
        # was frozen on v0.4.4 for exactly this reason. Runs only AFTER the
        # signature HARD GATE, so an unsigned/broken build can never go live.
        shell: bash  # windows-latest defaults to pwsh, can't run the .sh
        env:
          NEXUS_CI_TOKEN: ${{ secrets.NEXUS_CI_TOKEN }}
        run: ./scripts/promote-nexus.sh ${{ matrix.platform }} ${{ github.ref_name }}
